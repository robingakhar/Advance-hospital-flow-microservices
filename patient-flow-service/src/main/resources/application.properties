spring.application.name=patient-flow-service
server.port=8089

spring.datasource.url=jdbc:postgresql://localhost:5432/patient_flow_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.hospital.patientflow=DEBUG

# ===============================
# Resilience4j Circuit Breaker
# ===============================
resilience4j.circuitbreaker.instances.labLoadService.register-health-indicator=true
resilience4j.circuitbreaker.instances.labLoadService.sliding-window-size=5
resilience4j.circuitbreaker.instances.labLoadService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.labLoadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.labLoadService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.labLoadService.permitted-number-of-calls-in-half-open-state=2

# ===============================
# Kafka Configuration (Producer)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# Event Publishing Strategy
# ===============================
event.publish.rest.enabled=false
event.publish.kafka.enabled=true
